name: KWC Windows test build (fork only)

# Unsigned Windows build of this fork's test branch. Never part of an upstream pull request.

on:
  push:
    branches: ['kwc/corporate-build']

permissions:
  contents: read

concurrency:
  group: kwc-windows-test-build
  cancel-in-progress: true

jobs:
  build-win:
    if: github.repository == 'kanzwestmeier-consulting/orca'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build app
        shell: bash
        run: pnpm build:release

      - name: Package Windows installer
        shell: pwsh
        env:
          ORCA_BUILD_COMMIT: ${{ github.sha }}
        run: |
          node config/scripts/native-build/node-addons/ensure-native-runtime.mjs --runtime=electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip the portable folder
        shell: pwsh
        run: |
          7z a -tzip -mx=3 dist/orca-windows-portable.zip ./dist/win-unpacked/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist -File | Select-Object Name, Length

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: kwc-windows-test-build
          path: |
            dist/orca-windows-setup.exe
            dist/orca-windows-portable.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
